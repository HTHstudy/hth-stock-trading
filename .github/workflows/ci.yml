name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hth_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: hth_readonly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hth_test -d hth_readonly_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://hth_test:local_test_only@localhost:5432/hth_readonly_test
      - run: pnpm build
      - run: docker compose -f infra/docker-compose.yml config --quiet
      - run: docker compose -f infra/compose.local.yml config --quiet

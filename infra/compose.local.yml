name: hth-local

x-backend: &backend
  image: hth-local-backend
  build:
    context: ..
    dockerfile: infra/Dockerfile
    target: runtime
  user: '1000:1000'
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  security_opt: ['no-new-privileges:true']
  volumes:
    - app_data:/app/.local-data
    - dashboard_socket:/tmp/hth-dashboard-1000
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  web:
    image: hth-local-web
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web
    ports:
      - '127.0.0.1:${LOCAL_WEB_PORT:-5173}:8080'
    restart: unless-stopped
    init: true
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', '--header=Host: localhost', 'http://127.0.0.1:8080/health/web']
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    <<: *backend
    # Preserve the API's loopback-only boundary without trusting forwarded IPs.
    network_mode: 'service:web'
    command: ['node', 'apps/api/dist/main.js']
    environment:
      NODE_ENV: production
      TRADING_MODE: paper
      LOCAL_CONTAINER_MODE: 'true'
      LOCAL_DB_PASSWORD: '${LOCAL_DB_PASSWORD:-hth_local_only}'
      LOCAL_PAPER_DB_PASSWORD: '${LOCAL_PAPER_DB_PASSWORD:-local_paper_only}'
      LOCAL_PAPER_ACCOUNT_ID: '${LOCAL_PAPER_ACCOUNT_ID:-}'
      LOCAL_PAPER_KIND: '${LOCAL_PAPER_KIND:-synthetic}'
      LOCAL_WEB_PORT: '${LOCAL_WEB_PORT:-5173}'
      API_HOST: 127.0.0.1
      API_PORT: '4000'
      OWNER_PASSWORD_HASH: '${LOCAL_OWNER_PASSWORD_HASH:-}'
      DASHBOARD_ENABLED: '${LOCAL_MARKET_DASHBOARD_ENABLED:-false}'
      TOSS_CLIENT_ID: '${LOCAL_TOSS_CLIENT_ID:-}'
      TOSS_CLIENT_SECRET: '${LOCAL_TOSS_CLIENT_SECRET:-}'
      PAPER_DASHBOARD_ENABLED: '${LOCAL_PAPER_DASHBOARD_ENABLED:-false}'
      PAPER_DASHBOARD_KIND: '${LOCAL_PAPER_KIND:-synthetic}'
    depends_on:
      web:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    <<: *backend
    command: ['node', 'apps/worker/dist/main.js']
    environment:
      NODE_ENV: production
      TRADING_MODE: paper
      LOCAL_CONTAINER_MODE: 'true'
      LOCAL_DB_PASSWORD: '${LOCAL_DB_PASSWORD:-hth_local_only}'
      LOCAL_PAPER_DB_PASSWORD: '${LOCAL_PAPER_DB_PASSWORD:-local_paper_only}'
      LOCAL_PAPER_ACCOUNT_ID: '${LOCAL_PAPER_ACCOUNT_ID:-}'
      LOCAL_PAPER_KIND: '${LOCAL_PAPER_KIND:-synthetic}'
      WORKER_MODE: '${LOCAL_WORKER_MODE:-idle}'
      WORKER_SOURCE: '${LOCAL_WORKER_SOURCE:-synthetic-only}'
      WORKER_REQUEST_ID: '${LOCAL_WORKER_REQUEST_ID:-}'
      WORKER_SYMBOLS: '${LOCAL_WORKER_SYMBOLS:-KR:005930}'
      WORKER_SAMPLES: '${LOCAL_WORKER_SAMPLES:-60}'
      WORKER_INTERVAL_SECONDS: '${LOCAL_WORKER_INTERVAL_SECONDS:-60}'
      TOSS_CLIENT_ID: '${LOCAL_TOSS_CLIENT_ID:-}'
      TOSS_CLIENT_SECRET: '${LOCAL_TOSS_CLIENT_SECRET:-}'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hth
      POSTGRES_PASSWORD: '${LOCAL_DB_PASSWORD:-hth_local_only}'
      POSTGRES_DB: hth_trading
      LOCAL_PAPER_DB_PASSWORD: '${LOCAL_PAPER_DB_PASSWORD:-local_paper_only}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-paper-db.sh:/docker-entrypoint-initdb.d/10-paper.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hth -d hth_trading']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres_data:
  app_data:
  dashboard_socket:

name: hth-trading

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hth
      POSTGRES_PASSWORD: hth_local_only
      POSTGRES_DB: hth_trading
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hth -d hth_trading']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    profiles: ['apps']
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ['node', 'apps/api/dist/main.js']
    environment:
      NODE_ENV: production
      TRADING_MODE: paper
      API_HOST: 0.0.0.0
      API_PORT: 4000
    ports:
      - '127.0.0.1:4000:4000'
    init: true
    restart: unless-stopped

  worker:
    profiles: ['apps']
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ['node', 'apps/worker/dist/main.js']
    environment:
      NODE_ENV: production
      TRADING_MODE: paper
    init: true
    restart: unless-stopped

volumes:
  postgres_data:
